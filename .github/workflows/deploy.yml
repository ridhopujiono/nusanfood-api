name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ridhopujiono
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Image
        run: |
          docker build -t ghcr.io/ridhopujiono/nusanfood-api:latest .
          docker push ghcr.io/ridhopujiono/nusanfood-api:latest

      - name: Deploy & Migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/nusanfood
            docker compose pull
            docker compose up -d
            docker compose exec -T api ./migrate
